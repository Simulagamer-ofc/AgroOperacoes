<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2134">
  <meta name="description" content="Painel offline para operações agrícolas, máquinas, talhões, sementes e estoque.">
  <title>Nexus Agro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <!-- Estilo inicial local: evita mostrar o painel antes da abertura Nexus. -->
  <style>
    .nexus-splash{display:none}
    html.nexus-booting{overflow:hidden}
    html.nexus-booting .nexus-splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#061625;color:#e8f5fb;text-align:center;padding:24px;isolation:isolate}
    .nexus-splash-arte{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:85% center;opacity:.9;z-index:-2}
    .nexus-splash:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,37,.35),rgba(6,22,37,.2) 35%,rgba(6,22,37,.95));z-index:-1}
    .nexus-splash-conteudo{align-self:end;margin-bottom:clamp(24px,8vh,90px);max-width:100%}
    .nexus-splash-marca{font:800 clamp(30px,6vw,56px)/1.1 Inter,system-ui,sans-serif;letter-spacing:.08em;margin:0 0 14px;overflow-wrap:anywhere}
    .nexus-splash-marca span{color:#65e6a8}
    .nexus-splash-status{font:400 14px/1.5 Inter,system-ui,sans-serif;color:#d1e7ef;margin:0;display:flex;align-items:center;justify-content:center;gap:10px}
    .nexus-splash-spinner{width:18px;height:18px;flex:none;border:2px solid #456676;border-top-color:#65e6a8;border-radius:50%;animation:nexus-spin 1s linear infinite}
    @keyframes nexus-spin{to{transform:rotate(360deg)}}
    @media(max-aspect-ratio:3/4){.nexus-splash-arte{top:8%;height:60%;object-position:85% center}.nexus-splash:before{background:linear-gradient(180deg,rgba(6,22,37,.1),transparent 45%,#061625 78%)}}
    @media(prefers-reduced-motion:reduce){.nexus-splash-spinner{animation:none}}
  </style>
  <script src="splash.js"></script>
</head>
<body>
<div class="nexus-splash" id="nexusSplash" role="status" aria-live="polite" aria-label="Nexus Agro, carregando o sistema">
  <img class="nexus-splash-arte" src="img/nexus-globo.jpg" alt="" aria-hidden="true" fetchpriority="high">
  <div class="nexus-splash-conteudo"><p class="nexus-splash-marca">NEXUS <span>AGRO</span></p><p class="nexus-splash-status"><span class="nexus-splash-spinner" aria-hidden="true"></span>Carregando o sistema…</p></div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand nexus"><strong class="marca">NEXUS<span>AGRO</span></strong><small class="versao" title="Versão de teste 0.19.2">v0.19.2</small><small id="farmName">Minha fazenda</small></div>
    <nav class="nav" aria-label="Menu principal">
      <button data-route="inicio"><span class="icon">▦</span>Visão geral</button>
      <small class="nav-grupo">Campo</small>
      <button data-route="operacoes"><span class="icon">◷</span>Operações do dia</button>
      <button data-route="talhoes"><span class="icon">▤</span>Talhões</button>
      <button data-route="chuva"><span class="icon">☂</span>Chuvas</button>
      <button data-route="pragas"><span class="icon">✱</span>Pragas e doenças (MIP)</button>
      <button data-route="aplicacoes"><span class="icon">⚗</span>Aplicações e carência</button>
      <button data-route="maodeobra"><span class="icon">☺</span>Mão de obra</button>
      <small class="nav-grupo">Máquinas</small>
      <button data-route="maquinas"><span class="icon">⚙</span>Máquinas e manutenção</button>
      <button data-route="combustivel"><span class="icon">⛽</span>Combustível</button>
      <button data-route="afericao"><span class="icon">◎</span>Aferição e calibragem</button>
      <button data-route="catalogo"><span class="icon">⌕</span>Catálogo de máquinas</button>
      <button data-route="pontas"><span class="icon">💧</span>Catálogo de pontas</button>
      <small class="nav-grupo">Grãos e sementes</small>
      <button data-route="secagem"><span class="icon">♨</span>Secador e moega</button>
      <button data-route="sementes"><span class="icon">◉</span>Sementes e lotes</button>
      <small class="nav-grupo">Gestão</small>
      <button data-route="estoque"><span class="icon">□</span>Estoque e insumos</button>
      <button data-route="financeiro"><span class="icon">$</span>Financeiro</button>
      <button data-route="producao"><span class="icon">▲</span>Produção e margem</button>
      <button data-route="relatorios"><span class="icon">▥</span>Relatórios</button>
      <button data-route="cadastros"><span class="icon">☷</span>Cadastros e backup</button>
    </nav>
    <div class="sidebar-foot"><span>☀︎ / ☾</span><button class="theme-btn" id="themeBtn">Alternar tema</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main>
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div><h1 id="viewTitle">Visão Geral</h1><div class="date" id="date"></div></div><form class="search" id="searchForm"><span>⌕</span><input id="searchInput" type="search" aria-label="Pesquisar" placeholder="Pesquisar…"></form><div class="offline"><span class="dot"></span><span id="netStatus">Disponível offline</span></div><button class="install-btn" id="installBtn">⬇ Instalar aplicativo</button><button class="bell" id="bellBtn" aria-label="Alertas e pendências">🔔</button><div class="avatar" id="avatar">AO</div></header>
    <div class="content" id="view"></div>
  </main>
</div>
<nav class="mobile-nav" aria-label="Atalhos"><button data-route="inicio"><span>⌂</span>Início</button><button data-route="operacoes"><span>◷</span>Operações</button><button data-route="talhoes"><span>▤</span>Talhões</button><button data-route="estoque"><span>□</span>Estoque</button><button id="moreBtn" aria-label="Mais opções do menu"><span>•••</span>Mais</button></nav>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>
<script src="avaliador.js"></script>
<script src="app.js"></script>
<script src="afericao.js"></script>
<script src="secagem.js"></script>
<script src="catalogo.js"></script>
<script src="maqconfig.js"></script>
<script src="pontas.js"></script>
<script src="gastos.js"></script>
<script src="estoque.js"></script>
<script src="ubs.js"></script>
<script src="combustivel.js"></script>
<script src="financeiro.js"></script>
<script src="producao.js"></script>
<script src="lib/qrcode.js"></script>
<script src="rastreio.js"></script>
<script src="campo.js"></script>
<script src="nfe.js"></script>
<script src="sync.js"></script>
<script src="mapa.js"></script>
<script src="lcdpr.js"></script>
<script src="graficos.js"></script>
</body>
</html>
