<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2134">
  <meta name="description" content="Painel offline para operações agrícolas, máquinas, talhões, sementes e estoque.">
  <title>Nexus Agro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand nexus"><strong class="marca">NEXUS<span>AGRO</span></strong><small class="versao">Versão de teste 0.10.0</small><small id="farmName">Minha fazenda</small></div>
    <nav class="nav" aria-label="Menu principal">
      <button data-route="inicio"><span class="icon">▦</span>Visão geral</button>
      <button data-route="operacoes"><span class="icon">◷</span>Operações do dia</button>
      <button data-route="maquinas"><span class="icon">⚙</span>Máquinas e manutenção</button>
      <button data-route="afericao"><span class="icon">◎</span>Aferição e calibragem</button>
      <button data-route="secagem"><span class="icon">♨</span>Secador e moega</button>
      <button data-route="catalogo"><span class="icon">⌕</span>Catálogo de máquinas</button>
      <button data-route="talhoes"><span class="icon">▤</span>Talhões</button>
      <button data-route="sementes"><span class="icon">◉</span>Produção de sementes</button>
      <button data-route="lotes"><span class="icon">⌁</span>Lotes e rastreabilidade</button>
      <button data-route="estoque"><span class="icon">□</span>Estoque e insumos</button>
      <button data-route="gastos"><span class="icon">$</span>Controle de gastos</button>
      <button data-route="relatorios"><span class="icon">▥</span>Relatórios</button>
      <button data-route="cadastros"><span class="icon">☷</span>Cadastros e backup</button>
    </nav>
    <div class="sidebar-foot"><span>☀︎ / ☾</span><button class="theme-btn" id="themeBtn">Alternar tema</button></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main>
    <header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div><h1 id="viewTitle">Visão Geral</h1><div class="date" id="date"></div></div><form class="search" id="searchForm"><span>⌕</span><input id="searchInput" type="search" aria-label="Pesquisar" placeholder="Pesquisar operações, máquinas, lotes..."></form><div class="offline"><span class="dot"></span><span id="netStatus">Disponível offline</span></div><button class="install-btn" id="installBtn">⬇ Instalar aplicativo</button><button class="bell" id="bellBtn" aria-label="Pendências">♢</button><div class="avatar" id="avatar">AO</div></header>
    <div class="content" id="view"></div>
  </main>
</div>
<nav class="mobile-nav"><button data-route="inicio"><span>⌂</span>Início</button><button data-route="operacoes"><span>◷</span>Operações</button><button data-route="maquinas"><span>⚙</span>Máquinas</button><button data-route="afericao"><span>◎</span>Aferição</button><button id="moreBtn"><span>•••</span>Mais</button></nav>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>
<script src="avaliador.js"></script>
<script src="app.js"></script>
<script src="afericao.js"></script>
<script src="secagem.js"></script>
<script src="catalogo.js"></script>
<script src="maqconfig.js"></script>
<script src="gastos.js"></script>
<script src="graficos.js"></script>
</body>
</html>
