<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f36">
  <meta name="description" content="Gestão offline de operações agrícolas, máquinas, talhões, sementes e estoque.">
  <title>Agro Operações</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema antes de desenhar a página, para não piscar.
    (function(){var t=null;try{t=localStorage.getItem('agro-theme')}catch(e){}if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t})();
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 46c12-1 20-8 22-20 8 3 15 8 21 17-13 11-29 12-43 3Z" fill="#34d399"/><path d="M14 50c10-15 22-22 39-28" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div><div><strong>AGRO OPERAÇÕES</strong><small id="farmLabel">Configure em Cadastros</small></div></div>
    <nav class="nav" aria-label="Principal">
      <a href="#/" data-route=""><span class="icon">▦</span>Visão Geral</a>
      <a href="#/operacoes" data-route="operacoes"><span class="icon">◷</span>Operações do Dia</a>
      <a href="#/maquinas" data-route="maquinas"><span class="icon">⚙</span>Máquinas e Manutenção</a>
      <a href="#/talhoes" data-route="talhoes"><span class="icon">▤</span>Talhões</a>
    </nav>
    <div class="group-label">PRODUÇÃO</div>
    <nav class="nav" aria-label="Produção">
      <a href="#/sementes" data-route="sementes"><span class="icon">◉</span>Produção de Sementes</a>
      <a href="#/lotes" data-route="lotes"><span class="icon">⌁</span>Lotes e Rastreabilidade</a>
      <a href="#/estoque" data-route="estoque"><span class="icon">□</span>Estoque e Insumos</a>
    </nav>
    <div class="group-label">INTELIGÊNCIA</div>
    <nav class="nav" aria-label="Inteligência">
      <a href="#/relatorios" data-route="relatorios"><span class="icon">▥</span>Relatórios</a>
      <a href="#/cadastros" data-route="cadastros"><span class="icon">☷</span>Cadastros</a>
    </nav>
    <div class="sidebar-foot"><span>☀︎ / ☾</span><button class="theme-btn" data-act="theme">Alternar tema</button></div>
  </aside>
  <div class="overlay" id="overlay" data-act="close-menu"></div>
  <main>
    <header class="topbar">
      <button class="menu-btn" data-act="menu" aria-label="Abrir menu">☰</button>
      <div><h1 id="pageTitle">Visão Geral</h1><div class="date" id="date"></div></div>
      <div class="search"><span>⌕</span><input id="topSearch" type="search" aria-label="Pesquisar" placeholder="Pesquisar operações, máquinas, lotes..."></div>
      <a class="search-btn" href="#/busca" aria-label="Pesquisar">⌕</a>
      <div class="offline"><span class="dot"></span><span id="netStatus">Disponível offline</span></div>
      <button class="install-btn" id="installBtn" data-act="install">⬇ Instalar aplicativo</button>
      <button class="bell" data-act="bell" aria-label="Alertas" aria-expanded="false" aria-controls="alertsPopover">🔔<span class="bell-badge" id="bellBadge" hidden></span></button>
      <div class="avatar" id="avatar" title="">AO</div>
    </header>
    <div class="content" id="view" aria-live="polite"></div>
  </main>
</div>
<div class="card popover" id="alertsPopover" role="dialog" aria-label="Alertas"></div>
<nav class="mobile-nav" aria-label="Atalhos">
  <a href="#/" data-route=""><span>⌂</span>Início</a>
  <a href="#/operacoes" data-route="operacoes"><span>◷</span>Operações</a>
  <a href="#/maquinas" data-route="maquinas"><span>⚙</span>Máquinas</a>
  <a href="#/estoque" data-route="estoque"><span>□</span>Estoque</a>
  <button data-act="menu"><span>•••</span>Mais</button>
</nav>
<div class="modal" id="modal" data-act="modal-backdrop"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:24px">Ative o JavaScript para usar o Agro Operações.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
