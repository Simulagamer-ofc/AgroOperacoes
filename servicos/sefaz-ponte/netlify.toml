# MercaPlant — ponte da SEFAZ no Netlify (plano grátis).
# Importe o repositório no Netlify com "Base directory" = servicos/sefaz-ponte e crie a variável PONTE_CHAVE.
[build]
  command = "echo ponte"
  publish = "publico"
  # Cada publicação custa 15 dos 300 créditos do plano grátis: só publica quando esta pasta mudar
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/enviar"
  to = "/.netlify/functions/ponte"
  status = 200
  force = true

[[redirects]]
  from = "/saude"
  to = "/.netlify/functions/ponte"
  status = 200
  force = true
